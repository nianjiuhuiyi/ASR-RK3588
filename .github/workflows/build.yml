name: ASR-RK3588 CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-cross-compile:
    name: 交叉编译构建 (aarch64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            make
      
      - name: 验证交叉编译工具链
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version
      
      - name: 构建 (Release)
        if: matrix.build_type == 'Release'
        run: |
          chmod +x build.sh
          ./build.sh
      
      - name: 构建 (Debug)
        if: matrix.build_type == 'Debug'
        run: |
          chmod +x build.sh
          ./build.sh 1
      
      - name: 检查构建产物
        run: |
          if [ -f "install/asr_rknn_serve" ]; then
            echo "构建成功，可执行文件已生成"
            file install/asr_rknn_serve
            ls -lh install/
          else
            echo "构建失败，未找到可执行文件"
            exit 1
          fi
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: asr-rknn-serve-${{ matrix.build_type }}
          path: install/
          retention-days: 30

  build-verify:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: build-cross-compile
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载 Release 构建产物
        uses: actions/download-artifact@v4
        with:
          name: asr-rknn-serve-Release
          path: install/
      
      - name: 验证安装目录结构
        run: |
          echo "验证安装目录结构..."
          ls -lhR install/
          
          # 检查必需文件
          if [ -f "install/asr_rknn_serve" ]; then
            echo "✓ 可执行文件存在"
          else
            echo "✗ 可执行文件不存在"
            exit 1
          fi
          
          if [ -f "install/run.sh" ]; then
            echo "✓ run.sh 脚本存在"
          else
            echo "✗ run.sh 脚本不存在"
            exit 1
          fi
          
          if [ -f "install/stop.sh" ]; then
            echo "✓ stop.sh 脚本存在"
          else
            echo "✗ stop.sh 脚本不存在"
            exit 1
          fi
          
          if [ -d "install/resources" ]; then
            echo "✓ resources 目录存在"
          else
            echo "✗ resources 目录不存在"
            exit 1
          fi
          
          if [ -d "install/lib" ]; then
            echo "✓ lib 目录存在"
            ls -lh install/lib/
          else
            echo "✗ lib 目录不存在"
            exit 1
          fi
          
          echo "所有必需文件验证通过！"

  release:
    name: 创建发布版本
    runs-on: ubuntu-latest
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载 Release 构建产物
        uses: actions/download-artifact@v4
        with:
          name: asr-rknn-serve-Release
          path: ASR-RK3588-release/
      
      - name: 打包发布文件
        run: |
          cd ASR-RK3588-release
          tar -czf ../ASR-RK3588-${{ github.ref_name }}.tar.gz .
          cd ..
          ls -lh ASR-RK3588-${{ github.ref_name }}.tar.gz
      
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ASR-RK3588-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          body: |
            ## ASR-RK3588 Release ${{ github.ref_name }}
            
            ### 构建信息
            - 构建类型: Release
            - 目标平台: RK3588 (aarch64)
            - 交叉编译工具链: aarch64-linux-gnu
            
            ### 使用说明
            1. 解压发布包: `tar -xzf ASR-RK3588-${{ github.ref_name }}.tar.gz`
            2. 进入目录: `cd ASR-RK3588-release`
            3. 运行服务: `./run.sh`
            
            详细使用说明请参考项目 README.md
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}  # 注意github上设置的secrets的名称不能以 GITHUB*开头